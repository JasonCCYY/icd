<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="醫療工具" />
  <title>下班關掉！</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Password gate -->
  <div id="lock-screen">
    <div id="lock-box">
      <div id="lock-icon">🏥</div>
      <h2>醫療工具</h2>
      <p class="lock-sub">請輸入密碼以繼續</p>
      <input id="pw-input" type="password" placeholder="••••••••"
        autocomplete="current-password" inputmode="numeric" />
      <button id="pw-btn">確認</button>
      <div id="pw-error"></div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" hidden>

    <!-- Header -->
    <header id="main-header">
      <h1 id="header-title">ICD-10 搜尋</h1>
      <div id="soap-top-tabs" class="header-sub-tabs" style="display:none">
        <button class="soap-tab-btn active" data-soap-sheet="SOAP中正">中正</button>
        <button class="soap-tab-btn" data-soap-sheet="SOAP門診">門診</button>
        <button class="soap-tab-btn soap-tab-btn-ha" id="soap-ha-btn">HA / PT</button>
      </div>
      <div id="cert-top-tabs" class="header-sub-tabs" style="display:none">
        <button class="soap-tab-btn active" data-cert-sheet="診斷書中正">中正</button>
        <button class="soap-tab-btn" data-cert-sheet="診斷書門診">門診</button>
      </div>
      <div id="ops-top-tabs" class="header-sub-tabs" style="display:none">
        <button class="ops-tab-btn active" data-ops-tab="ops">手術碼</button>
        <button class="ops-tab-btn" data-ops-tab="notes">備註</button>
      </div>
      <button id="refresh-btn" aria-label="重新整理">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </header>

    <!-- Pages -->
    <main id="pages">

      <!-- ICD page -->
      <div class="page active" id="page-icd">
        <div id="search-area">
          <div id="input-wrap">
            <input id="search-input" type="text"
              placeholder="搜索 ICD-10（支援縮寫：rt lt fr spr…）"
              autocomplete="off" autocorrect="off"
              autocapitalize="off" spellcheck="false" />
            <button id="clear-btn" aria-label="清除">✕</button>
          </div>
          <div id="abbr-hint"></div>
        </div>
        <div id="results-area">
          <div id="status"></div>
          <ul id="results-list"></ul>
        </div>
      </div>

      <!-- SOAP page -->
      <div class="page" id="page-soap">

        <!-- HA calculator -->
        <div id="soap-ha-content" hidden>
          <div id="ha-input-row">
            <input id="ha-year" type="number" min="100" max="999" />
            <span class="ha-sep">.</span>
            <input id="ha-mmdd" type="text" maxlength="5" placeholder="MMDD" autocomplete="off" inputmode="numeric" />
          </div>
          <div id="ha-display"></div>
          <div id="ha-result-180"></div>
          <div id="ha-week"></div>
          <div id="pt-section">
            <div id="pt-cat-btns"></div>
            <div id="pt-disease-btns"></div>
            <div id="pt-items"></div>
          </div>
        </div>

        <div id="soap-main-content">
        <div id="soap-type-area">
          <div id="soap-type-label">選擇類型</div>
          <div id="soap-type-btns"></div>
        </div>
        <div id="soap-picker" hidden>
<div id="soap-chips-area">
            <div class="soap-chip-section" id="soap-s-section">
              <span class="soap-section-label">S</span>
              <div class="soap-chips" id="soap-s-chips"></div>
            </div>
            <div class="soap-chip-section" id="soap-pe-section">
              <span class="soap-section-label">PE</span>
              <div class="soap-chips" id="soap-pe-chips"></div>
            </div>
            <div class="soap-chip-section" id="soap-xr-section">
              <span class="soap-section-label">XR</span>
              <div class="soap-chips" id="soap-xr-chips"></div>
            </div>
            <div class="soap-chip-section" id="soap-p-section">
              <span class="soap-section-label">P</span>
              <div class="soap-chips" id="soap-p-chips"></div>
            </div>
            <div class="soap-chip-section" id="soap-dx-section">
              <span class="soap-section-label">診斷碼</span>
              <div class="soap-chips" id="soap-dx-chips"></div>
            </div>
          </div>
        </div>
        <div id="soap-editor-area">
          <textarea id="soap-textarea" placeholder="S:&#10;PE:&#10;XR:&#10;P:"></textarea>
          <div id="soap-editor-btns">
            <button id="soap-copy-btn">複製</button>
            <button id="soap-restore-btn" disabled>恢復</button>
          </div>
        </div>
        </div><!-- /soap-main-content -->
      </div>

      <!-- 診斷書 page -->
      <div class="page" id="page-cert">
        <div id="cert-type-area">
          <div id="cert-type-label">選擇類型</div>
          <div id="cert-type-btns"></div>
        </div>
        <div id="cert-picker" hidden>
          <div id="cert-chips-area">
            <div class="soap-chip-section" id="cert-num-section">
              <span class="soap-section-label">編號</span>
              <div class="soap-chips" id="cert-num-chips"></div>
            </div>
            <div class="soap-chip-section" id="cert-disease-section">
              <span class="soap-section-label">疾病</span>
              <div class="soap-chips" id="cert-disease-chips"></div>
            </div>
            <div class="soap-chip-section" id="cert-process-section">
              <span class="soap-section-label">過程</span>
              <div class="soap-chips" id="cert-process-chips"></div>
            </div>
          </div>
        </div>
        <div id="cert-editor-area">
          <textarea id="cert-textarea" placeholder="點選疾病與過程…"></textarea>
          <div id="cert-editor-btns">
            <button id="cert-copy-btn">複製</button>
            <button id="cert-restore-btn" disabled>恢復</button>
          </div>
        </div>
      </div>

      <!-- 手術碼 page -->
      <div class="page" id="page-ops">
        <div id="ops-tab-ops">
        <div id="ops-search-area">
          <div id="ops-input-wrap">
            <input id="ops-search-input" type="text"
              placeholder="搜尋名稱、手術碼、部位、處置碼…"
              autocomplete="off" autocorrect="off"
              autocapitalize="off" spellcheck="false" />
            <button id="ops-clear-btn" aria-label="清除">✕</button>
          </div>
          <div id="ops-actions">
            <button id="ops-show-all-btn">顯示全部</button>
          </div>
        </div>
        <div id="ops-status"></div>
        <div id="ops-results"></div>
        </div><!-- /ops-tab-ops -->
        <div id="ops-tab-notes" hidden>
          <div id="notes-type-btns"></div>
          <div id="notes-list"></div>
        </div>
      </div>

    </main>

    <!-- Bottom tab bar -->
    <nav id="tab-bar">
      <button class="tab active" data-page="icd" data-title="ICD-10 搜尋">
        <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm3 10H9v-1h2v-4H9v-1h4v5h2v1z"/></svg>
        <span>ICD-10</span>
      </button>
      <button class="tab" data-page="soap" data-title="SOAP">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 13h8v1H8v-1zm0 3h5v1H8v-1zm0-6h3v1H8v-1z"/></svg>
        <span>SOAP</span>
      </button>
      <button class="tab" data-page="cert" data-title="診斷書">
        <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.07-.33.18-.64.18-1a3 3 0 0 0-6 0c0 .36.11.67.18 1H10a2 2 0 0 0-2 2v2a1 1 0 0 0 1 1h1v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-7h1a1 1 0 0 0 1-1V8a2 2 0 0 0-2-2zm-8-1a1 1 0 1 1 2 0 1 1 0 0 1-2 0z"/></svg>
        <span>診斷書</span>
      </button>
      <button class="tab" data-page="ops" data-title="手術碼">
        <svg viewBox="0 0 24 24"><path d="M21.71 3.29a1 1 0 0 0-1.42 0l-1.7 1.7-1.28-1.28a1 1 0 0 0-1.42 1.42l.57.57-8.1 8.09A5 5 0 0 0 7 17v1H6a1 1 0 0 0 0 2h12a1 1 0 0 0 0-2h-1v-.18a5 5 0 0 0-1.06-3.09l-.25-.3 1.6-1.6.57.57a1 1 0 0 0 1.42-1.42l-1.28-1.28 1.7-1.7a1 1 0 0 0 0-1.71zM15 18v1H9v-1a3 3 0 0 1 3-3 3 3 0 0 1 3 3z"/></svg>
        <span>手術碼</span>
      </button>
    </nav>

    <div id="toast">已複製！</div>
  </div>

  <script>
  const PW_HASH = '6ed09607ae0f7186a908a39b29e64cea658d96283aa28d37cebf3af395911895';

  // 私人模式：URL 帶 ?p=1 時存入 sessionStorage，之後重新整理也會保持
  if (new URLSearchParams(location.search).get('p') === '1') {
    sessionStorage.setItem('icd_private', '1');
  }

  function addBackBtn() {
    if (sessionStorage.getItem('icd_private') !== '1') return;
    if (document.getElementById('back-to-ortho')) return;
    const btn = document.createElement('button');
    btn.id = 'back-to-ortho';
    btn.textContent = '← 手術紀錄';
    btn.onclick = () => window.history.back();
    document.getElementById('main-header').insertBefore(btn, document.getElementById('main-header').firstChild);
  }

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  async function tryUnlock() {
    const val = document.getElementById('pw-input').value;
    const hash = await sha256(val);
    if (hash === PW_HASH) {
      doUnlock();
    } else {
      const err = document.getElementById('pw-error');
      err.textContent = '密碼錯誤';
      document.getElementById('pw-input').value = '';
      setTimeout(() => { err.textContent = ''; }, 2000);
    }
  }
  function bindLock() {
    document.getElementById('pw-btn').addEventListener('click', tryUnlock);
    document.getElementById('pw-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') tryUnlock();
    });
    setTimeout(() => document.getElementById('pw-input').focus(), 100);
  }
  function doUnlock() {
    sessionStorage.setItem('icd_auth', '1');
    document.getElementById('lock-screen').remove();
    document.getElementById('app').hidden = false;
    addBackBtn();
    setTimeout(() => { if (typeof prefetchAll === 'function') prefetchAll(); }, 300);
  }
  if (sessionStorage.getItem('icd_auth') === '1') {
    document.getElementById('lock-screen').remove();
    document.getElementById('app').hidden = false;
    addBackBtn();
  } else if (location.hash) {
    const raw = location.hash.slice(1);
    history.replaceState(null, '', location.pathname + location.search);
    sha256(raw).then(h => { if (h === PW_HASH) doUnlock(); else bindLock(); });
  } else {
    bindLock();
  }
</script>

  <script src="app.js"></script>
</body>
</html>
